name: Build RootHide Safari Tweak (.deb)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos, LLD & RootHide Toolchain on Linux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm git curl zip unzip fakeroot dpkg-dev perl libssl-dev make
          git clone --recursive --depth 1 https://github.com/roothide/theos.git /tmp/theos
          mkdir -p /tmp/theos/toolchain/linux/iphone/bin
          for tool in clang clang++ ar strip ranlib nm lipo; do
            ln -sf $(which $tool 2>/dev/null || which llvm-$tool 2>/dev/null || echo /usr/bin/clang) /tmp/theos/toolchain/linux/iphone/bin/$tool
          done
          ln -sf $(which ld.lld) /tmp/theos/toolchain/linux/iphone/bin/ld
          ln -sf $(which ld.lld) /tmp/theos/toolchain/linux/iphone/bin/lld
          ln -sf $(which ld.lld) /tmp/theos/toolchain/linux/iphone/bin/ld64.lld
          curl -fsSL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 -o /tmp/theos/toolchain/linux/iphone/bin/ldid
          chmod +x /tmp/theos/toolchain/linux/iphone/bin/ldid
          mkdir -p /tmp/theos/sdks
          curl -fsSL https://github.com/theos/sdks/archive/refs/heads/master.tar.gz | tar xz -C /tmp/theos/sdks --strip-components=1

      - name: Build RootHide DEB Package
        env:
          THEOS: /tmp/theos
          THEOS_PACKAGE_SCHEME: roothide
        run: |
          make package FINALPACKAGE=1
          mkdir -p output
          cp packages/*.deb output/

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Safari18Stealth-RootHide-DEB
          path: output/*.deb
