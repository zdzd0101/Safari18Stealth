name: Build Safari18Stealth (RootHide)

on:
  workflow_dispatch:
  push:
    branches:
      - roothide-test-candidate-2.1

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install dpkg ldid

      - name: Install RootHide Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Verify JavaScript source and tests
        run: |
          node --check Engine/Bootstrap.js
          node --check Polyfills/Polyfills.js
          node --check CSS/CSSCompat.js
          node --check Diagnostics/Diagnostics.js
          node Tests/polyfills.test.js

      - name: Build RootHide package
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1

      - name: Verify package metadata and files
        run: |
          set -e
          DEB="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$DEB"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"
          dpkg-deb -f "$DEB" Architecture | grep -Fx 'iphoneos-arm64e'
          dpkg-deb --contents "$DEB" | grep -F 'Safari18Stealth/Bootstrap.js'
          dpkg-deb --contents "$DEB" | grep -F 'Safari18Stealth/Polyfills.js'
          dpkg-deb --contents "$DEB" | grep -F 'Safari18Stealth/CSSCompat.js'
          dpkg-deb --contents "$DEB" | grep -F 'Safari18Stealth/Diagnostics.js'
          ls -lh "$DEB"

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: Safari18Stealth-2.1.0-RootHide-iphoneos-arm64e
          path: packages/*.deb
          if-no-files-found: error
