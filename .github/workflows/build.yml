name: Safari18Stealth RootHide build (Ubuntu)

on:
  workflow_dispatch:
  push:
    branches:
      - roothide-test-candidate-2.1

permissions:
  contents: read

# Do not cancel a build merely because a later documentation/source commit arrives.
concurrency:
  group: safari18stealth-roothide-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Safari-only RootHide DEB on Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang make perl git curl ca-certificates dpkg-dev nodejs python3

      - name: Install RootHide Theos and verify toolchain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
          test -d "$THEOS/makefiles"
          echo "Theos directory:"
          ls -la "$THEOS"
          echo "Searching for signing tools:"
          find "$THEOS" -type f \( -name ldid -o -name llvm-lipo -o -name clang \) -print || true
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Verify source layout and Safari-only filter
        run: |
          set -euxo pipefail
          test -f Makefile
          test -f Tweak.x
          test -f Safari18Stealth.plist
          test -f control
          test -f Engine/Bootstrap.js
          test -f Polyfills/Polyfills.js
          test -f CSS/CSSCompat.js
          test -f Diagnostics/Diagnostics.js
          python3 - <<'PY'
          import plistlib
          with open('Safari18Stealth.plist', 'rb') as f:
              data = plistlib.load(f)
          assert data['Filter']['Bundles'] == ['com.apple.mobilesafari']
          print('Safari-only injection filter verified')
          PY

      - name: Verify JavaScript syntax and tests
        run: |
          set -euxo pipefail
          node --version
          node --check Engine/Bootstrap.js
          node --check Polyfills/Polyfills.js
          node --check CSS/CSSCompat.js
          node --check Diagnostics/Diagnostics.js
          node Tests/polyfills.test.js

      - name: Build RootHide package
        run: |
          set -euxo pipefail
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1

      - name: Verify package metadata, binary and runtime resources
        run: |
          set -euxo pipefail
          DEB="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$DEB"
          dpkg-deb --info "$DEB"
          ARCH="$(dpkg-deb -f "$DEB" Architecture)"
          test "$ARCH" = "iphoneos-arm64e"
          test "$(dpkg-deb -f "$DEB" Version)" = "2.1.1"
          dpkg-deb --contents "$DEB" | tee package-files.txt
          grep -F 'Safari18Stealth.dylib' package-files.txt
          grep -F 'Safari18Stealth.plist' package-files.txt
          grep -F 'Safari18Stealth/Bootstrap.js' package-files.txt
          grep -F 'Safari18Stealth/Polyfills.js' package-files.txt
          grep -F 'Safari18Stealth/CSSCompat.js' package-files.txt
          grep -F 'Safari18Stealth/Diagnostics.js' package-files.txt
          mkdir extracted
          dpkg-deb -x "$DEB" extracted
          find extracted -type f -name '*.dylib' -exec file {} \;
          ls -lh "$DEB"

      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: Safari18Stealth-2.1.1-RootHide-iphoneos-arm64e
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30
